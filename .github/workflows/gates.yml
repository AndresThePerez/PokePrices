# PokéPrices CI is exactly `make gates` (exit criterion; R22). Nothing else runs here.
name: gates
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - run: make gates
