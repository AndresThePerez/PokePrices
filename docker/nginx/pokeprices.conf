# PokéPrices: one nginx serves the SPA build and passes Laravel paths to php-fpm (R14).
# A client X-Request-Id is kept only when it matches the pattern Laravel accepts, so a quote
# in a hostile header can never break the two static JSON bodies below.
map $http_x_request_id $pp_request_id {
    default                                       $request_id;
    "~^[A-Za-z0-9][A-Za-z0-9._-]{7,127}$"         $http_x_request_id;
}

# What the browser may keep, by the path nginx finally serves ($uri is the fallback file after a try_files
# redirect, so every client route reads /index.html here). An empty value adds no header: the API's own
# Cache-Control then passes through untouched. The first matching pattern wins.
#   - a Vite file with a content hash in its name never changes: kept for a year;
#   - the app's page is stored but revalidated on every visit, so a deploy shows at once;
#   - the other files of the web root (icon, robots.txt, pictures) keep a modest hour.
map $uri $pp_cache_control {
    default                                                  "";
    "~^/assets/.+-[A-Za-z0-9_-]{8}\.[A-Za-z0-9]+$"             "public, max-age=31536000, immutable";
    /index.html                                              "no-cache";
    "~^/assets/"                                             "public, max-age=3600";
    "~^/[^/]+\.(?:svg|png|txt|ico|webmanifest|xml)$"         "public, max-age=3600";
}

# The content policy of the app's page, sent in report-only mode: a blocked picture or chart would break
# the site for every visitor, and the page's own inline scripts and styles cannot all be checked from here,
# so the browser reports what the policy would block and blocks nothing. It names exactly what the app uses:
# its own origin for scripts, styles and API calls (XHR on the same origin), the catalogue's picture host and
# data: pictures (the sign-in QR code) for images, and the hashed pre-paint theme script in index.html (change
# that script and its hash here together). The framing, base URL and plugin limits stay in the enforced header.
map $uri $pp_page_policy {
    default                                                  "";
    /index.html                                              "default-src 'self'; script-src 'self' 'sha256-iYbUWBOQ7wRLREGY4kgiN87SA1KJfx74CMM4JtI608c='; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://images.pokemontcg.io; font-src 'self'; connect-src 'self'; worker-src 'none'; manifest-src 'self'";
}

server {
    listen 8095 default_server;
    server_name pokeprices.localhost;
    root /usr/share/nginx/html;
    client_max_body_size 1m;
    # Security headers on every response. HSTS leaves out includeSubDomains and preload because sibling
    # subdomains are other sites; browsers ignore it over plain http, so dev and production share this file.
    # Referrer-Policy stays same-origin: Sanctum treats a same-origin GET without Origin as first-party
    # from its Referer, so no-referrer would turn signed-in reads into 401. The enforced CSP limits framing, the
    # base URL and plugins only; the page's source policy is report-only (see the second map).
    # A location with its own add_header drops these, so both named locations below repeat them.
    # The cache and report-only policy headers come from the two maps above, and only at server level: the
    # ordinary locations carry no add_header, so they inherit every line here.
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cache-Control $pp_cache_control always;
    add_header Content-Security-Policy-Report-Only $pp_page_policy always;

    # The version stays out of the Server header and the error pages.
    server_tokens off;

    # Text is compressed; Vary tells a shared cache the body depends on Accept-Encoding. Pictures are not listed.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/css text/plain text/xml application/javascript text/javascript application/json
        application/problem+json application/manifest+json application/xml image/svg+xml;

    # API, health, Fortify (R12, incl. /two-factor-challenge) and Sanctum paths go to Laravel.
    location ~ ^/(?:v1/|up$|sanctum/|login$|logout$|register$|forgot-password$|reset-password(?:/|$)|email/|user/|two-factor-challenge$) {
        fastcgi_pass api:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /workspace/api/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_X_REQUEST_ID $pp_request_id;
        error_page 502 503 504 = @api_unavailable;
        error_page 413 = @payload_too_large;
    }

    location @api_unavailable {
        default_type application/problem+json;
        add_header X-Request-Id $pp_request_id always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        return 503 '{"type":"https://pokeprices.andrestheperez.com/problems/api-unavailable","title":"API Unavailable","status":503,"request_id":"$pp_request_id"}';
    }

    location @payload_too_large {
        default_type application/problem+json;
        add_header X-Request-Id $pp_request_id always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        return 413 '{"type":"https://pokeprices.andrestheperez.com/problems/payload-too-large","title":"Payload Too Large","status":413,"request_id":"$pp_request_id"}';
    }

    # Everything else is the SPA; client routes fall back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
