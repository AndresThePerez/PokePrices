# PokéPrices workstation dev stack. Dev only; nothing here is a server setting.
name: pokeprices

services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: pokeprices
      POSTGRES_DB: pokeprices
      # Unpublished compose network only: no password exists anywhere (open question 11).
      POSTGRES_HOST_AUTH_METHOD: trust
    shm_size: 256m
    mem_limit: 1g
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokeprices -d pokeprices"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis-queue:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    # Queue, locks, unique jobs and the rate limiter (R13): never evict, persist the queue.
    command: ["redis-server", "--maxmemory", "48mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes", "--save", ""]
    mem_limit: 64m
    volumes:
      - redisqueue:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis-cache:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    # Cache only (R13): evict least recently used at 75% of the cap, no persistence.
    command: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "no", "--save", ""]
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      target: dev
    user: "0:0"
    working_dir: /workspace/api
    volumes:
      - ./:/workspace
    environment: &api-env
      APP_NAME: PokéPrices
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://pokeprices.localhost:${PP_HTTP_PORT:-8095}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: pokeprices
      DB_USERNAME: pokeprices
      DB_PASSWORD: ""
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis-queue
      REDIS_CACHE_HOST: redis-cache
      REDIS_PORT: "6379"
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: database
      LOG_CHANNEL: stderr_json
      SANCTUM_STATEFUL_DOMAINS: pokeprices.localhost:8095
      # PokéSearch on the workstation, reached through the host gateway (R134).
      POKESEARCH_URL: ${POKESEARCH_URL:-http://host.docker.internal:8081}
    mem_limit: 384m
    dns_opt: ["timeout:1", "attempts:1"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      target: dev
    user: "0:0"
    working_dir: /workspace/api
    volumes:
      - ./:/workspace
    environment: *api-env
    command: ["php", "artisan", "queue:work", "redis", "--queue=default", "--sleep=1", "--tries=3", "--max-time=3600", "--memory=256"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
    mem_limit: 384m
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan queue:work' >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12

  scheduler:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      target: dev
    user: "0:0"
    working_dir: /workspace/api
    volumes:
      - ./:/workspace
    environment: *api-env
    command: ["php", "artisan", "schedule:work"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan schedule:work' >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12

  node:
    image: node:22-slim@sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392
    # Web tooling and the scaffolder run here (R6, R27); glibc matches the host's optional binaries.
    user: "0:0"
    working_dir: /workspace/web
    volumes:
      - ./:/workspace
    command: ["sleep", "infinity"]
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "node", "-e", "require('fs').accessSync('/workspace/web')"]
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      target: runtime
    ports:
      - "127.0.0.1:${PP_HTTP_PORT:-8095}:8095"
    networks:
      default:
        aliases:
          - pokeprices.localhost
    mem_limit: 64m
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8095/"]
      interval: 5s
      timeout: 3s
      retries: 30

  tools:
    build:
      context: .
      dockerfile: docker/tools/Dockerfile
    working_dir: /repo
    volumes:
      - type: bind
        source: ./
        target: /repo
        read_only: true
      - type: bind
        source: ./.gates
        target: /repo/.gates
      - trivy-cache:/root/.cache/trivy
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "gitleaks version >/dev/null && trivy --version >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  redisqueue:
  trivy-cache:
